[project]
name = "calgacus-mlx"
version = "0.1.0"
description = "MLX implementation of the Calgacus protocol for LLM-based steganography: hide a meaningful text inside another coherent, plausible text of comparable token length."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Matt Hodges" },
]
keywords = ["steganography", "llm", "mlx", "calgacus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: BSD License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "mlx>=0.31",
    "mlx-lm>=0.31",
    "click>=8.3",
    "mnemonic>=0.21",
    "tomli-w>=1.2",
]

[project.scripts]
calgacus = "calgacus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calgacus"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
